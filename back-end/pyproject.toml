[project]
name = "alef-backend"
version = "0.1.0"
description = "Alef backend API"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "alembic",
    "bcrypt==4.0.1",
    "cryptography==43.0.1",
    "email_validator==2.2.0",
    "fastapi-utils",
    "fastapi==0.115.0",
    "passlib==1.7.4",
    "psycopg2-binary==2.9.9",
    "pydantic==2.9.2",
    "pydantic_core==2.23.4",
    "python-dotenv==1.0.1",
    "python-jose",
    "python-json-logger",
    "python-multipart==0.0.12",
    "SQLAlchemy==2.0.35",
    "starlette==0.38.6",
    "uvicorn==0.30.6",
]

[dependency-groups]
dev = [
    "black",
    "coverage",
    "flake8",
    "httpx",
    "ipython",
    "isort",
    "pytest-asyncio",
    "pytest-cov",
    "pytest",
]
