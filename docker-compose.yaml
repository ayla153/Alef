version: '3.8'

services:
  # -----------------------------------------------
  # 1. Backend (FastAPI)
  # -----------------------------------------------
  back-end:
    build: ./back-end    
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:secret123@db:5432/my_db
    volumes:
      - ./back-end:/app  
    depends_on:
      db:
        condition: service_healthy

  # -----------------------------------------------
  # 2. Frontend (React / Vue)
  # -----------------------------------------------
  front-end:
    build: ./front-end   
    ports:
      - "5173:5173"   
    volumes:
      - ./front-end:/app 
      - /app/node_modules 
    environment:
      - VITE_API_URL=http://localhost:8000 

  # -----------------------------------------------
  # 3. Database (PostgreSQL)
  # -----------------------------------------------
  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=secret123
      - POSTGRES_DB=my_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: